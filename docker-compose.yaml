services:
  mqtt:
    image: eclipse-mosquitto:2.0.22
    container_name: mqtt
    volumes:
      - "./mosquitto-data:/mosquitto"
    ports:
      - "1883:1883"  # unencypted mqtt
      - "9001:9001"  # HTTP/Websocket protocol
    command: "mosquitto -c /mosquitto/mosquitto-no-auth.conf" # overrrides default conf file from image with file in volume
    restart: unless-stopped

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:2.12.1
    container_name: zigbee2mqtt
    volumes:
      #- ./zigbee2mqtt-data:/app/data
      - z2m_data:/app/data
      - /run/udev:/run/udev:ro
    ports:
      - 8080:8080
    environment:
      - TZ=Europe/Berlin
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    restart: unless-stopped
    depends_on:
      - mqtt

  # Backup sidecar for the Zigbee2MQTT state. Mirrors the ha-postgres-backup pattern
  # (dcron + backup-entrypoint.sh + one run at startup) but backs up FILES, not a DB.
  # Dumps land on z2m_backups, which IS on the NAS: live data local, backups off-box.
  # DELIBERATELY no depends_on in either direction. If elephant is down this container
  # fails to start and the Zigbee mesh keeps running regardless -- that independence is
  # the whole point of the change, so do not "tidy" a depends_on in here later.
  # /data is mounted read-only: a backup process must not be able to corrupt the thing
  # it is backing up. Restores are a deliberate one-off, see scripts/restore.sh.
  zigbee2mqtt-backup:
    image: alpine:3.22
    container_name: zigbee2mqtt-backup
    restart: unless-stopped
    environment:
      - SERVICE_NAME=zigbee2mqtt
      - DATA_DIR=/data
      - BACKUP_DIR=/backups
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      # Own cron var, not the shared BACKUP_CRON_SCHEDULE: 03:20 keeps this clear of the
      # 03:00 Postgres dump so the two are not writing to the NAS at the same moment.
      - BACKUP_CRON_SCHEDULE=${ZIGBEE_BACKUP_CRON_SCHEDULE:-20 3 * * *}
    volumes:
      - z2m_data:/data:ro
      - z2m_backups:/backups
      - ./zigbee2mqtt/scripts:/scripts:ro
    command: ["sh", "/scripts/backup-entrypoint.sh"]

  homeassistant:
    container_name: homeassistant
      # image: ghcr.io/home-assistant/home-assistant:2026.7.2
    image: ghcr.io/home-assistant/home-assistant:2026.7.4
    volumes:
      - ha_data:/config
      - ha_backups:/backups
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
      - ${MOVIES_PATH}:/media/movies:ro
        #devices:
        #  - /dev/ttyUSB0:/dev/ttyUSB0
    restart: unless-stopped
    privileged: true
    ports:
      - 8123:8123 # web ui
      - 1400:1400 # sonos event subscriptions
      - 1900:1900/udp  # SSDP for discovery (consider macvlan approach if breaking)
      - 5353:5353/udp  # mDNS for discovery
    # NO depends_on zigbee2mqtt, deliberately -- do not add it back. Home Assistant
    # reaches the Zigbee mesh through the MQTT broker, never by talking to zigbee2mqtt
    # directly, so it has nothing to wait for. With the dependency in place, a
    # zigbee2mqtt that could not start took Home Assistant down with it, which is the
    # opposite of what you want: the mesh is the durable layer, HA is the app on top.
    depends_on:
      ha-postgres:
        condition: service_healthy

  # Postgres backing store for the HA recorder. On LOCAL disk (not NFS) on
  # purpose: SQLite on the NFS /config volume was the likely cause of the
  # recurring recorder DB corruption. See notes.txt / migration runbook.
  ha-postgres:
    image: postgres:16-alpine
    container_name: ha-postgres
    environment:
      - POSTGRES_USER=homeassistant
      - POSTGRES_DB=homeassistant
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ha_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeassistant -d homeassistant"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Automated DB backup sidecar (standardized across services). Runs backup.sh on
  # BACKUP_CRON_SCHEDULE via dcron + once at startup. Dumps are Postgres custom-format
  # (.dump) and land on ha_backups (NFS/NAS), alongside HA's native config tars.
  # Manual ops:
  #   docker compose exec ha-postgres-backup /scripts/backup.sh                 # back up now
  #   docker compose exec ha-postgres-backup ls -lh /backups/                   # list dumps
  #   docker compose exec ha-postgres-backup /scripts/restore_db.sh /backups/home-assistant_db_YYYY-MM-DD_HH-MM-SS.dump
  #   (stop the homeassistant container before a live restore, restart it after)
  ha-postgres-backup:
    image: postgres:16-alpine
    container_name: ha-postgres-backup
    restart: unless-stopped
    depends_on:
      ha-postgres:
        condition: service_healthy
    environment:
      - SERVICE_NAME=home-assistant
      - POSTGRES_HOST=ha-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=homeassistant
      - POSTGRES_USER=homeassistant
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - BACKUP_DIR=/backups
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - BACKUP_CRON_SCHEDULE=${BACKUP_CRON_SCHEDULE:-0 3 * * *}
    volumes:
      - ha_backups:/backups
      - ./scripts:/scripts:ro
    command: ["sh", "/scripts/backup-entrypoint.sh"]

      #  appdaemon:
      #    build: ./appdaemon
      #    container_name: appdaemon
      #    volumes:
      #      - ./appdaemon:/conf
      #    environment:
      #      - HA_URL=${HA_URL}
      #      - TOKEN=${HA_TOKEN}
      #    restart: unless-stopped

volumes:
  ha_data:
    driver: local
    driver_opts:
      type: nfs
      o: ${NFS_OPTIONS}
      device: ${NAS_HA_PATH}
  ha_backups:
    driver: local
    driver_opts:
      type: nfs
      o: ${NFS_OPTIONS}
      device: ${NAS_HA_BACKUP_PATH}
  # Zigbee2MQTT live state on LOCAL disk, deliberately NOT NFS -- same reasoning as
  # ha_pg_data below. database.db and state.json are written continuously and the NFS
  # mounts are `soft`, so a NAS blip returns EIO mid-write instead of blocking; that is
  # the failure mode that corrupted the SQLite recorder. It also means the Zigbee mesh
  # starts and runs with elephant switched off, which it previously could not.
  #
  # Explicit `name:` pins the volume identity so it does NOT carry the compose project
  # as a prefix. That is what lets these services move to their own compose project
  # without the data having to move with them.
  z2m_data:
    name: zigbee2mqtt_data
    driver: local
  # ...and the backups DO go to the NAS, so the state exists on a second machine.
  # This is the inversion the recorder migration made: live local, backups off-box.
  z2m_backups:
    name: zigbee2mqtt_backups
    driver: local
    driver_opts:
      type: nfs
      o: ${NFS_OPTIONS}
      device: ${NAS_ZIGBEE_BACKUP_PATH}
  # Local-disk volume for the HA recorder Postgres (deliberately NOT NFS).
  ha_pg_data:
    driver: local
